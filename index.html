<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickBite — Order Food Fast</title>
    <meta name="description" content="Browse restaurant menus and order your favourite meals with QuickBite." />
    <script>
      // Apply saved/system theme before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem('quickbite_theme');
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
